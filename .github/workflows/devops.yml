# ========================================================
# GitHub Actions CI Workflow for NextOrder
# ========================================================
# This workflow runs automatically on every push or pull
# request to the main branches. It validates the code syntax,
# performs security audits, and ensures the Docker image builds
# successfully.
# ========================================================

name: NextOrder Continuous Integration

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ------------------------------------------------------
  # Job 1: Node.js Quality & Security Checks
  # ------------------------------------------------------
  code-quality:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Security Vulnerability Scan
        run: |
          # Audit production dependencies and warn about any vulnerabilities
          npm audit --audit-level=high || echo "Vulnerabilities found during scan. Please review npm audit report."

      - name: Validate Server Startup Code
        run: |
          # Verify that server.js is syntactically correct by compiling it
          node --check server.js

  # ------------------------------------------------------
  # Job 2: Container Verification Build
  # ------------------------------------------------------
  docker-build:
    name: Docker Image Verification
    runs-on: ubuntu-latest
    needs: code-quality # Run only after code quality passes

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-docker-action@v4
        # Note: In standard GitHub runners, Docker is pre-installed. 
        # Using Buildx ensures we have high-performance building and caching.

      - name: Set up QEMU (for Multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx Setup
        uses: docker/setup-buildx-action@v3

      - name: Build Local Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Do not push yet, only verify compilation
          tags: nextorder-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ========================================================
      # OPTIONAL: Continuous Deployment (CD) Stage
      # To enable this, uncomment the section below and add your secrets:
      # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to your GitHub repository secrets.
