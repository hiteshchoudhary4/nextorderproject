<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - NextOrder</title>
    <meta name="description" content="Sign in to your NextOrder vendor account to manage your menu and orders.">
    <link rel="stylesheet" href="style.css">
    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
</head>

<body>
    <!-- Theme Toggle (Floating) -->
    <button class="theme-toggle" id="theme-toggle" style="position: fixed; top: 16px; right: 16px;"
        aria-label="Toggle theme">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <svg class="moon-icon hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
    </button>

    <div class="auth-page">
        <div class="auth-container">
            <!-- Logo -->
            <div class="auth-logo">
                <h1>NextOrder</h1>
                <p style="color: var(--color-text-secondary); margin-top: var(--spacing-sm);">
                    Vendor Portal
                </p>
            </div>

            <!-- Login Card -->
            <div class="auth-card">
                <h2 class="auth-title">Sign in</h2>

                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-input" placeholder="name@example.com" required
                            autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="Enter your password"
                            required autocomplete="current-password">
                    </div>

                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-lg);">
                        <label
                            style="display: flex; align-items: center; gap: var(--spacing-sm); font-size: var(--font-size-sm); color: var(--color-text-secondary); cursor: pointer;">
                            <input type="checkbox" id="remember" style="width: 16px; height: 16px;">
                            Remember me
                        </label>
                        <a href="#" style="font-size: var(--font-size-sm);">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn--primary btn--large btn--full" id="login-btn">
                        Sign in
                    </button>
                </form>

                <!-- Error Message -->
                <div id="error-message" class="hidden"
                    style="margin-top: var(--spacing-md); padding: var(--spacing-md); background: rgba(255, 59, 48, 0.1); border-radius: var(--radius-md); color: var(--color-error); font-size: var(--font-size-sm); text-align: center;">
                    Invalid email or password
                </div>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Create one</a>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        // Theme Toggle
        const themeToggle = document.getElementById('theme-toggle');
        const sunIcon = themeToggle.querySelector('.sun-icon');
        const moonIcon = themeToggle.querySelector('.moon-icon');

        // Check for saved theme preference or default to light
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            if (theme === 'dark') {
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            } else {
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            }
        }
    </script>
</body>

</html>
